<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — FORME</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="site-nav"></div>
  <main class="auth-layout wrap">
    <div class="auth-intro">
      <p class="eyebrow">START YOUR COLLECTION</p>
      <h1>Make room<br>for <span>good</span></h1>
      <p>Create an account to keep your cart personal and follow your orders </p>
    </div>
    <div class="auth-card">
      <p class="eyebrow">NEW HERE?</p>
      <h2>Create account</h2>
      <form id="register-form">
        <label>Your name<input type="text" id="name" placeholder="Full name" required minlength="2"></label>
        <label>Email address<input type="email" id="email" placeholder="abid@gmail.com" required></label>
        <label>Password<input type="password" id="password" placeholder="At least 6 characters" required
            minlength="6"></label>
        <label>Confirm password<input type="password" id="confirm-password" placeholder="Enter it again"
            required></label>
        <button class="button button-blue full" type="submit">Create account <span>↗</span></button>
        <p class="form-message" id="message"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      <p class="tiny-note">Demo project: account data is stored in this browser only</p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>

</html>
